<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiji Campus Bus & Weather Dashboard</title>

<style>

/* ==========================
   PAGE STYLING
========================== */

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#c62828,#ef5350);
}

.container{
    width:80%;
    max-width:800px;
    margin:40px auto;
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
}

h1{
    text-align:center;
    color:#c62828;
}

.card{
    margin-top:25px;
    background:#f7f7f7;
    padding:20px;
    border-left:6px solid #c62828;
    border-radius:10px;
}

label{
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;
    font-size:16px;
    border-radius:6px;
    border:1px solid #999;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#c62828;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#8e0000;
}

#result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}

.error{
    color:red;
}

.success{
    color:#c62828;
}

.weather{
    font-size:18px;
    line-height:1.8;
}

.footer{
    text-align:center;
    margin-top:30px;
    color:#555;
}

</style>
</head>

<body>

<div class="container">

<h1>🚌 Fiji Campus Bus & Weather Dashboard</h1>

<!-- ==========================
     BUS FARE CALCULATOR
========================== -->

<div class="card">

<h2>Bus Fare Calculator</h2>

<label for="budget">Enter Your Bus Budget (FJD)</label>

<input
type="number"
id="budget"
placeholder="Example: 20">

<button onclick="calculateRides()">
Calculate Bus Rides
</button>

<div id="result"></div>

</div>

<!-- ==========================
     WEATHER FORECAST
========================== -->

<div class="card">

<h2>🌤 Today's Weather Forecast - Nadi</h2>

<div class="weather">

📍 <strong>Location:</strong> Nadi, Fiji<br><br>

🌤️ <strong>Condition:</strong> Mostly Sunny<br><br>

🌡️ <strong>Temperature:</strong> 31°C<br><br>

💨 <strong>Wind:</strong> 18 km/h (Easterly)<br><br>

💧 <strong>Humidity:</strong> 68%<br><br>

🌧️ <strong>Chance of Rain:</strong> 20%

</div>

</div>

<div class="footer">
Fiji Campus Bus & Weather Dashboard
</div>

</div>

<script>

/*
==================================================
Bus Fare Calculator

This function calculates how many bus rides
a student can afford.

Assumptions:
- One bus ride costs FJD $1.50.

Validation:
- If the budget is empty,
  display an error message.
- If the budget is zero or negative,
  display an error message.
- Otherwise calculate the number of rides.

Math.floor() is used so only complete rides
are counted.
==================================================
*/

function calculateRides(){

    // Get the value entered by the user
    let budget = document.getElementById("budget").value;

    // Check for invalid input
    if(budget === "" || isNaN(budget) || Number(budget) <= 0){

        document.getElementById("result").innerHTML =
        '<span class="error">Please enter a valid positive dollar amount.</span>';

        return;
    }

    // Convert the input to a number
    budget = parseFloat(budget);

    // Calculate the number of bus rides
    let rides = Math.floor(budget / 1.50);

    // Display the result
    document.getElementById("result").innerHTML =
    '<span class="success">You can afford <strong>' +
    rides +
    '</strong> bus rides.</span>';

}

</script>

</body>
</html>
